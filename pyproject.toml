[project]
name = "android-studio-mcp"
version = "1.0.0"
description = "Professional MCP server that lets Claude operate Android Studio (IntelliJ) and the full Android toolchain: Gradle, ADB, emulator/AVD, SDK manager, APK analysis, headless code inspection, live-IDE bridge and a native UI fallback."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maurice Putinas" }]
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.scripts]
android-studio-mcp = "android_studio_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_studio_mcp"]
artifacts = ["*.jar", "*.xml"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.0"]
